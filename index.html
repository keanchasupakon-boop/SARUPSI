  document.getElementById('foreColor').oninput = e=> exec('foreColor', e.target.value);

// ระบบบีบอัดรูปภาพอัตโนมัติ (Image Compression) ก่อนแทรกลงโน้ต
  document.getElementById('imgBtn').onclick = () => {
    let fileInput = document.createElement('input'); fileInput.type = 'file'; fileInput.accept = 'image/*';
    fileInput.onchange = e => {
      let file = e.target.files[0]; let reader = new FileReader();
      reader.onload = (event) => { 
        let img = new Image();
        img.onload = () => {
          let canvas = document.createElement('canvas');
          let MAX_WIDTH = 800; // บีบอัดความกว้างสูงสุดไม่เกิน 800px
          let scale = img.width > MAX_WIDTH ? MAX_WIDTH / img.width : 1;
          canvas.width = img.width * scale; canvas.height = img.height * scale;
          let ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          // แปลงกลับเป็น JPEG คุณภาพ 75% ลดขนาดไฟล์มหาศาล!
          let compressed = canvas.toDataURL('image/jpeg', 0.75);
          exec('insertHTML', `<img src="${compressed}" style="max-width:100%; border-radius:8px;"><br>`); 
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }; fileInput.click();
  };
  document.getElementById('mathBtn').onclick = () => {
    let formula = prompt("ใส่สูตร LaTeX (เช่น E=mc^2 หรือ \\frac{a}{b}):");
    if(formula) {
      try {
        let html = katex.renderToString(formula, {throwOnError: false});
        exec('insertHTML', `<span contenteditable="false" style="padding:0 4px; display:inline-block;">${html}</span>&nbsp;`);
      } catch(e) { alert("สูตร LaTeX ไม่ถูกต้อง"); }
    }
  };
  document.getElementById('tableBtn').onclick = () => {
    exec('insertHTML', `<table style="width:100%; border-collapse: collapse; margin: 10px 0;" border="1"><tr><th style="padding:8px;">หัวข้อ</th><th style="padding:8px;">รายละเอียด</th></tr><tr><td style="padding:8px;"><br></td><td style="padding:8px;"><br></td></tr></table><br>`);
  };
  document.getElementById('checkBtn').onclick = () => {
    exec('insertHTML', `<input type="checkbox" style="margin-right:6px;"><span style="outline:none;">พิมพ์งานที่ต้องทำ...</span><br>`);
  };
  document.getElementById('noteToCardBtn').onclick = () => {
    const selection = window.getSelection().toString();
    if(!selection) { toast("กรุณาคลุมดำข้อความที่ต้องการตั้งเป็นคำถามก่อน!"); return; }
    let answer = prompt(`สร้างการ์ดจากคำถาม: "${selection}"\nกรุณาพิมพ์ "คำตอบ":`);
    if(answer) {
      const unit = currentUnit();
      let fcItem = unit.summaries.find(s => s.type === 'flashcard');
      if(!fcItem) {
        fcItem = {id:uid(), type:'flashcard', title:'Auto-generated Cards', content:{cards:[]}, updatedAt:now()};
        unit.summaries.push(fcItem);
      }
      fcItem.content.cards.push({ id:uid(), front: selection, back: answer, reps: 0, ease: 2.5, interval: 0, nextReview: now() });
      toast("สร้าง Flashcard สำเร็จ!");
    }
  };
  let t;
  nb.addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(save, 400); });
  function save(){ item.content = nb.innerHTML; item.updatedAt = now(); }
}
function tb(cmd,title,label){ return `<button data-cmd="${cmd}" title="${title}">${label}</button>`; }
function tbBlock(block,label){ return `<button data-block="${block}" title="${block}">${label}</button>`; }

/* ---- MIND MAP EDITOR (REAL-TIME AUTO-LAYOUT & AUTO-PAN) ---- */
function renderMindmapEditor(item){
  const body = document.getElementById('editorBody');
  body.innerHTML = `
    <div class="mm-toolbar">
      <button id="mmAddRoot">+ เพิ่มหัวข้อหลัก</button>
      <button id="mmCenter" style="color:var(--sage-deep); border-color:var(--sage); background:rgba(107, 143, 113, 0.1);">🎯 กลับจุดศูนย์กลาง</button>
      <span class="sep"></span>
      <button id="mmZoomOut">-</button><span id="mmZoomVal" style="font-size:12px; font-weight:bold; min-width:40px; text-align:center;">100%</span><button id="mmZoomIn">+</button>
      <button id="mmExport" style="margin-left:8px;">💾 Export PNG</button>
      <span class="hint">คีย์ลัด: กด Tab (แตกกิ่งย่อย) | กด Enter (เพิ่มระดับเดียวกัน)</span>
    </div>
    <div class="mm-viewport" id="mmViewport"><div class="mm-canvas" id="mmCanvas" style="width:4000px; height:3000px;"><svg id="mmSvg"></svg></div></div>`;
  
  const canvas = document.getElementById('mmCanvas');
  const viewport = document.getElementById('mmViewport');
  let selectedNode = item.content.nodes.find(n=>n.root) ? item.content.nodes[0].id : null;
  
  let zoomLevel = 1;
  const updateZoom = () => { canvas.style.transform = `scale(${zoomLevel})`; canvas.style.transformOrigin = '0 0'; document.getElementById('mmZoomVal').innerText = Math.round(zoomLevel*100)+'%'; };
  
  viewport.addEventListener('wheel', e => { if(e.ctrlKey||e.metaKey){ e.preventDefault(); zoomLevel += e.deltaY*-0.001; zoomLevel = Math.min(Math.max(0.3, zoomLevel),3); updateZoom(); } });
  document.getElementById('mmZoomIn').onclick = () => { zoomLevel += 0.1; updateZoom(); };
  document.getElementById('mmZoomOut').onclick = () => { zoomLevel -= 0.1; updateZoom(); };
  document.getElementById('mmExport').onclick = () => {
    toast("กำลังสร้างรูปภาพ..."); html2canvas(canvas, { backgroundColor: '#f6f2ea' }).then(cvs => { let a = document.createElement('a'); a.href = cvs.toDataURL("image/png"); a.download = `MindMap_${item.title||'Untitled'}.png`; a.click(); });
  };

  viewport.addEventListener('mousedown', e=>{
    if(e.target.closest('.mm-node') || e.target.closest('.mm-collapse-btn')) return; 
    const startX=e.clientX, startY=e.clientY, startLeft=viewport.scrollLeft, startTop=viewport.scrollTop;
    viewport.classList.add('panning');
    let moved=false;
    function mv(ev){ moved=true; viewport.scrollLeft = startLeft - (ev.clientX-startX); viewport.scrollTop = startTop - (ev.clientY-startY); }
    function up(){ viewport.classList.remove('panning'); document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); }
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  });

  // --- 1. ฟังก์ชันจัดระเบียบอัตโนมัติ (Auto-Layout Core) ---
  function applyAutoLayout() {
    const root = item.content.nodes.find(n => n.root);
    if(!root) return;
    const gapX = 240; const gapY = 60;
    function calcHeight(nodeId) {
      const node = item.content.nodes.find(n => n.id === nodeId);
      const kids = item.content.nodes.filter(n => n.parentId === nodeId && !node.collapsed);
      if(kids.length === 0) { node._h = gapY; } 
      else { node._h = kids.reduce((sum, kid) => sum + calcHeight(kid.id), 0); }
      return node._h;
    }
    function layout(nodeId, x, startY) {
      const node = item.content.nodes.find(n => n.id === nodeId);
      node.x = x; node.y = startY + (node._h / 2) - 20;
      const kids = item.content.nodes.filter(n => n.parentId === nodeId && !node.collapsed);
      let currY = startY;
      kids.forEach(kid => { layout(kid.id, x + gapX, currY); const kNode = item.content.nodes.find(n => n.id === kid.id); currY += kNode._h; });
    }
    calcHeight(root.id);
    layout(root.id, root.x, root.y - (root._h / 2)); // วางโดยยึดตำแหน่ง root ปัจจุบันเป็นหลัก
  }

  // --- 2. ฟังก์ชันกล้องวิ่งตาม (Auto-Pan / Center Camera) ---
  function focusNode(nodeId) {
    const node = item.content.nodes.find(n => n.id === nodeId);
    if(!node) return;
    // คำนวณหาจุดกึ่งกลางของหน้าจอ
    const targetX = (node.x * zoomLevel) - (viewport.clientWidth / 2) + 120; // 120 คือ offset เผื่อความกว้างโหนด
    const targetY = (node.y * zoomLevel) - (viewport.clientHeight / 2) + 30;
    viewport.scrollTo({ left: Math.max(0, targetX), top: Math.max(0, targetY), behavior: 'smooth' });
  }

  document.getElementById('mmCenter').onclick = () => {
    const root = item.content.nodes.find(n => n.root);
    if(root) focusNode(root.id);
  };
  document.getElementById('mmAddRoot').onclick = () => {
    if(item.content.nodes.length > 0) { toast("มีหัวข้อหลักอยู่แล้วครับ! ให้แตกกิ่งย่อยแทนนะ"); return; }
    addChildNode(null);
  };

  function addChildNode(parentId){
    const base = parentId ? item.content.nodes.find(n=>n.id===parentId) : null;
    if(base && base.collapsed) base.collapsed = false; // กางกิ่งแม่ก่อนเพิ่มลูก
    
    // ตั้งค่าเริ่มต้น (แต่เดี๋ยว Auto-Layout จะจัดการวางให้ใหม่เอง)
    const nn = {id:uid(), text:'', x: base ? base.x + 200 : 1800, y: base ? base.y : 1500, color: base ? base.color : Math.floor(Math.random()*NODE_COLORS.length), parentId: parentId, root: !base && item.content.nodes.length===0, collapsed: false};
    item.content.nodes.push(nn);
    selectedNode = nn.id;
    
    applyAutoLayout(); // จัดระเบียบทันทีที่สร้าง
    item.updatedAt = now();
    draw();
    
    setTimeout(() => { 
      focusNode(nn.id); // กล้องวิ่งตามไปที่กิ่งใหม่ทันที!
      const txt = canvas.querySelector(`.mm-node[data-id="${nn.id}"] .txt`); 
      if(txt) { txt.contentEditable = 'true'; txt.focus(); } 
    }, 50);
  }

  function isVisible(node) {
    let curr = node;
    while(curr.parentId) {
      let p = item.content.nodes.find(n => n.id === curr.parentId);
      if(!p) break;
      if(p.collapsed) return false;
      curr = p;
    }
    return true;
  }

  function draw(){
    canvas.querySelectorAll('.mm-node').forEach(n=>n.remove());
    const visibleNodes = item.content.nodes.filter(n => isVisible(n));

    visibleNodes.forEach(node=>{
      const el = document.createElement('div');
      el.className = 'mm-node' + (node.root?' root':'') + (node.id===selectedNode?' selected':'');
      el.style.left = node.x+'px'; el.style.top = node.y+'px';
      el.style.background = NODE_COLORS[node.color||0];
      el.dataset.id = node.id;
      
      const displayText = node.text === '' ? '<span style="color:rgba(0,0,0,0.3);">พิมพ์หัวข้อ...</span>' : escapeHtml(node.text);
      
      const kids = item.content.nodes.filter(n => n.parentId === node.id);
      let collapseBtnHtml = '';
      if(kids.length > 0) {
        collapseBtnHtml = `<div class="mm-collapse-btn" data-act="collapse" title="ยุบ/ขยายกิ่ง">${node.collapsed ? kids.length : '−'}</div>`;
      }

      el.innerHTML = `<span class="txt" contenteditable="false" style="display:inline-block; width:100%; min-height:20px;">${displayText}</span>
        ${collapseBtnHtml}
        <div class="ctrl">
          <button data-act="add" title="แตกกิ่งย่อย (Tab)">+</button>
          <button data-act="color" title="เปลี่ยนสี">🎨</button>
          ${node.root?'':'<button data-act="del" title="ลบโหนดทิ้ง">✕</button>'}
        </div>`;
      canvas.appendChild(el);

      const collBtn = el.querySelector('[data-act="collapse"]');
      if(collBtn) {
        collBtn.addEventListener('pointerdown', e => {
          e.stopPropagation();
          node.collapsed = !node.collapsed;
          applyAutoLayout(); // จัดระเบียบใหม่เมื่อพับ/กาง
          item.updatedAt = now(); draw(); focusNode(node.id); // เลื่อนกล้องกลับมาหาโหนดหลัก
        });
      }

      el.addEventListener('pointerdown', e => {
        if(e.target.closest('.ctrl') || e.target.closest('.mm-collapse-btn') || e.target.isContentEditable) return;
        e.stopPropagation(); el.setPointerCapture(e.pointerId); 
        selectedNode = node.id;
        canvas.querySelectorAll('.mm-node').forEach(n=>n.classList.remove('selected'));
        el.classList.add('selected');

        const startX = e.clientX, startY = e.clientY;
        let dropTarget = null, isDragging = false; 

        // ถ้าระบบ Auto Layout ทำงาน การลาก (Drag) จะเป็นการดึงเส้นโยงเพื่อหา Parent ใหม่เท่านั้น (ไม่ให้ตำแหน่งเละ)
        const dummyLine = document.createElementNS('http://www.w3.org/2000/svg','path');
        dummyLine.setAttribute('stroke', 'var(--amber)');
        dummyLine.setAttribute('stroke-width', '2');
        dummyLine.setAttribute('stroke-dasharray', '5,5');
        dummyLine.setAttribute('fill', 'none');

        const onPointerMove = (ev) => {
          if (Math.abs(ev.clientX - startX) > 3 || Math.abs(ev.clientY - startY) > 3) {
            isDragging = true;
            if(!node.root && !document.getElementById('dummyLine')) {
               document.getElementById('mmSvg').appendChild(dummyLine);
            }
          }
          if (!isDragging || node.root) return;

          // ลากเส้นประจากจุดเดิม ไปหาปลายเมาส์
          const ax = node.x + (el.offsetWidth/2); const ay = node.y + (el.offsetHeight/2);
          const bx = node.x + ((ev.clientX - startX) / zoomLevel); const by = node.y + ((ev.clientY - startY) / zoomLevel);
          dummyLine.setAttribute('d', `M${ax},${ay} L${bx},${by}`);

          el.style.pointerEvents = 'none'; 
          const hoverEl = document.elementFromPoint(ev.clientX, ev.clientY);
          el.style.pointerEvents = 'auto'; 
          
          const newTarget = hoverEl ? hoverEl.closest('.mm-node') : null;
          if(dropTarget && dropTarget !== newTarget) dropTarget.style.outline = '';
          if(newTarget && newTarget !== el && !node.root) {
            dropTarget = newTarget;
            dropTarget.style.outline = '3px solid var(--amber)'; dropTarget.style.outlineOffset = '2px'; dropTarget.style.borderRadius = '16px';
          } else dropTarget = null;
        };

        const onPointerUp = (ev) => {
          el.releasePointerCapture(e.pointerId);
          el.removeEventListener('pointermove', onPointerMove); el.removeEventListener('pointerup', onPointerUp); el.removeEventListener('pointercancel', onPointerUp);
          if(dummyLine.parentNode) dummyLine.remove();

          if(dropTarget) {
            const newParentId = dropTarget.dataset.id;
            if(newParentId !== node.parentId) { node.parentId = newParentId; toast("เปลี่ยนการเชื่อมโยงสำเร็จ ✨"); }
            dropTarget.style.outline = ''; 
          }
          
          if(isDragging) {
             applyAutoLayout(); // จัดระเบียบใหม่ทันทีหลังย้ายเสร็จ
             item.updatedAt=now(); draw(); 
          }
        };

        el.addEventListener('pointermove', onPointerMove); el.addEventListener('pointerup', onPointerUp); el.addEventListener('pointercancel', onPointerUp);
      });

      const txt = el.querySelector('.txt');
      const startEdit = () => { txt.contentEditable = 'true'; txt.focus(); document.execCommand('selectAll',false,null); };

      txt.addEventListener('dblclick', (e) => { e.stopPropagation(); startEdit(); });
      let lastTap = 0;
      txt.addEventListener('touchstart', (e) => {
        const currentTime = new Date().getTime(); const tapLength = currentTime - lastTap;
        if (tapLength < 300 && tapLength > 0) { e.preventDefault(); e.stopPropagation(); startEdit(); }
        lastTap = currentTime;
      });

      txt.addEventListener('blur', ()=>{ 
        txt.contentEditable='false'; 
        node.text = txt.innerText.trim() === 'พิมพ์หัวข้อ...' ? '' : txt.innerText.trim(); 
        if(node.text === '') node.text = 'ไอเดียใหม่'; 
        applyAutoLayout(); item.updatedAt=now(); draw(); 
      });
      
      txt.addEventListener('keydown', e=>{ 
        if(e.key === 'Enter' && !e.shiftKey) { 
          e.preventDefault(); txt.blur(); 
          if(!node.root) addChildNode(node.parentId);
        }
        if(e.key === 'Tab') { e.preventDefault(); txt.blur(); addChildNode(node.id); }
      });

      el.querySelector('[data-act="add"]').onclick = e=>{ e.stopPropagation(); addChildNode(node.id); };
      const colorBtn = el.querySelector('[data-act="color"]');
      if(colorBtn) colorBtn.onclick = e=>{ e.stopPropagation(); node.color = ((node.color||0)+1)%NODE_COLORS.length; item.updatedAt=now(); draw(); };
      const delBtn = el.querySelector('[data-act="del"]');
      if(delBtn) delBtn.onclick = e=>{ 
        e.stopPropagation(); 
        const kids = item.content.nodes.filter(n=>n.parentId===node.id);
        if(kids.length > 0) {
            openModal({title:'ลบกิ่งนี้ทิ้ง?', msg:`กิ่งย่อยทั้งหมดจะหายไปถาวร!`, danger:true, submitLabel:'ลบ', onSubmit:()=>{ deleteSubtree(node.id); applyAutoLayout(); draw(); }});
        } else { deleteSubtree(node.id); applyAutoLayout(); draw(); focusNode(node.parentId); }
      };
    });
    
    drawLines(visibleNodes);
  }

  function deleteSubtree(id){
    const kids = item.content.nodes.filter(n=>n.parentId===id).map(n=>n.id);
    kids.forEach(k=>deleteSubtree(k));
    item.content.nodes = item.content.nodes.filter(n=>n.id!==id);
    item.updatedAt = now();
  }

  function drawLines(visibleNodes){
    const svg = document.getElementById('mmSvg');
    svg.innerHTML = '';
    visibleNodes.forEach(node=>{
      if(!node.parentId) return;
      const a = canvas.querySelector(`.mm-node[data-id="${node.parentId}"]`);
      const b = canvas.querySelector(`.mm-node[data-id="${node.id}"]`);
      if(!a||!b) return;
      
      const ax = a.offsetLeft + a.offsetWidth;
      const ay = a.offsetTop + (a.offsetHeight/2);
      const bx = b.offsetLeft;
      const by = b.offsetTop + (b.offsetHeight/2);
      
      const cp1x = ax + (bx - ax) / 2.5; const cp1y = ay;
      const cp2x = bx - (bx - ax) / 2.5; const cp2y = by;

      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d', `M${ax},${ay} C${cp1x},${cp1y} ${cp2x},${cp2y} ${bx},${by}`);
      svg.appendChild(path);
    });
  }
  
  if(item.content.nodes.length===0) { addChildNode(null); } 
  else { 
      // โหลดไฟล์เก่าปุ๊บ จัดระเบียบและเล็งกล้องไปที่ Root ทันที
      applyAutoLayout(); 
      draw(); 
      setTimeout(()=> { 
        const root = item.content.nodes.find(n => n.root);
        if(root) focusNode(root.id);
      }, 100);
  }
}

/* ---- FLASHCARD EDITOR (อัปเกรด UX แบบตารางรายการ) ---- */
function renderFlashcardEditor(item){
  const body = document.getElementById('editorBody');

  draw(); // เรียกวาดครั้งแรก

  // 3. ระบบโหมดทดสอบ (Spaced Repetition) — ยังคงความ 3D เด้งๆ ไว้ที่นี่
  document.getElementById('studyBtn').onclick = () => {
    // กรองเอาเฉพาะการ์ดที่ถึงเวลาต้องทวน (หรือยังไม่เคยทวน)
    const cardsToStudy = (item.content.cards || []).filter(c => !c.nextReview || c.nextReview <= now());
    if(cardsToStudy.length === 0) { toast("🎉 เก่งมาก! คุณทบทวนการ์ดของวันนี้ครบหมดแล้ว"); return; }
    
    let currentIdx = 0;
    function renderStudyCard() {
      if(currentIdx >= cardsToStudy.length) { closeModal(); toast("จบการทดสอบรอบนี้!"); item.updatedAt=now(); draw(); return; }
      
      let c = cardsToStudy[currentIdx];
      const root = document.getElementById('modalRoot');

             <div class="fc-inner" style="transition: transform 0.6s var(--bounce, ease); transform-style: preserve-3d; width:100%; height:100%;">
                
                <div class="fc-face fc-front" style="display:flex; flex-direction:column; padding:28px; font-size:22px; text-align:center; background:white; border-radius:16px; box-shadow:0 20px 40px rgba(0,0,0,0.2);">
                  <div class="fc-label" style="text-align:left; color:var(--text-faint); margin-bottom:16px;">QUESTION</div>
                  <div style="margin:auto; word-break:break-word; white-space:pre-wrap;">${escapeHtml(c.front)}</div>
                  <button id="flipActionBtn" style="margin-top:auto; padding:14px; border-radius:12px; border:none; background:var(--ink-900); color:white; font-weight:600; cursor:pointer; font-size:16px;">แตะเพื่อดูคำตอบ</button>
                </div>
                
                <div class="fc-face fc-back" style="display:flex; flex-direction:column; padding:28px; font-size:20px; text-align:center; background:white; border-radius:16px; box-shadow:0 20px 40px rgba(0,0,0,0.2);">
                  <div class="fc-label" style="text-align:left; color:var(--text-faint); margin-bottom:16px;">ANSWER</div>
                  <div style="margin:auto; overflow-y:auto; max-height:180px; word-break:break-word; white-space:pre-wrap;">${escapeHtml(c.back)}</div>
                  
                  <div style="margin-top:auto; display:flex; gap:8px;">
                    <button class="ans-btn" data-q="1" style="flex:1; background:var(--coral); color:white; border:none; border-radius:8px; padding:12px; font-weight:600; cursor:pointer;">ลืม (Again)</button>
                    <button class="ans-btn" data-q="3" style="flex:1; background:var(--amber-deep); color:white; border:none; border-radius:8px; padding:12px; font-weight:600; cursor:pointer;">พอได้ (Hard)</button>
                    <button class="ans-btn" data-q="5" style="flex:1; background:var(--sage); color:white; border:none; border-radius:8px; padding:12px; font-weight:600; cursor:pointer;">จำได้ (Easy)</button>
                  </div>
                </div>

</div>
          </div>
          <div style="position:absolute; top:24px; left:24px; color:rgba(255,255,255,0.7); font-weight:600; font-size:15px; font-family:'Prompt', sans-serif;">
            🎯 ทบทวนไปแล้ว ${currentIdx} / ${cardsToStudy.length} ใบ
          </div>
          <button onclick="closeModal()" style="position:absolute; top:20px; right:24px; background:none; border:none; color:white; font-size:32px; cursor:pointer;">✕</button>
        </div>`;
      
      // ปุ่มพลิกการ์ด
      document.getElementById('flipActionBtn').onclick = () => document.getElementById('studyCard').classList.add('flipped');
      
      // คำนวณความจำ (SM-2 Algorithm)
      root.querySelectorAll('.ans-btn').forEach(btn => {
        btn.onclick = (e) => {
          let quality = parseInt(e.target.dataset.q);
          c.reps = c.reps || 0; c.ease = c.ease || 2.5; c.interval = c.interval || 0;
          
          if (quality < 3) { c.reps = 0; c.interval = 1; }
          else {
            if (c.reps === 0) c.interval = 1; else if (c.reps === 1) c.interval = 6;
            else c.interval = Math.round(c.interval * c.ease);
            c.reps++;
          }
          // คำนวณค่าความยากง่าย (Ease) ใหม่
          c.ease = Math.max(1.3, c.ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
          // กำหนดวันทบทวนรอบถัดไป (86400000 ms = 1 วัน)
          c.nextReview = now() + (c.interval * 86400000); 
          
          currentIdx++; 
          renderStudyCard(); // เรียกการ์ดใบต่อไป
        };
      });
    }
    renderStudyCard();
  };
}
/* ---- OUTLINE EDITOR (UI/UX REVAMPED) ---- */
function renderOutlineEditor(item){
  const body = document.getElementById('editorBody');
  
  body.innerHTML = `
    <div class="toolbar" style="flex-shrink:0; padding:12px 24px; background:var(--paper-raised); border-bottom:1px solid var(--paper-line); display:flex; justify-content:space-between; align-items:center;">
      <span class="hint" style="font-size:13px; color:var(--text-soft); font-family:'Prompt', sans-serif;">
        <b>💡 คีย์ลัด:</b> <kbd style="background:#eee; padding:2px 6px; border-radius:4px;">Enter</kbd> (บรรทัดใหม่) | <kbd style="background:#eee; padding:2px 6px; border-radius:4px;">Tab</kbd> (เลื่อนย่อหน้า) | ลาก <b style="letter-spacing:-2px;">⋮⋮</b> เพื่อสลับที่
      </span>
      <button id="olClearChecked" style="padding:6px 12px; border-radius:6px; background:var(--paper); border:1px solid var(--paper-line); font-size:12px; font-weight:600; color:var(--text-soft); cursor:pointer; transition:0.2s;">🧹 ลบ Task ที่เสร็จแล้ว</button>
    </div>
    
    <div class="outline-wrap">
      <div class="outline-container">
        <h1 style="margin: 0 0 24px 64px; font-size: 28px; color: var(--ink-900); border-bottom: 2px solid var(--paper-line); padding-bottom: 12px;">${escapeHtml(item.title) || 'Outline'}</h1>
        <div id="olRows"></div>
        <button class="ol-add" id="olAdd">+ เพิ่มหัวข้อใหม่</button>
      </div>
    </div>
    
    <!-- เมนูลอยตัวตอนคลุมดำ (Floating Menu) -->
    <div id="floatingMenuOutline">
      <button data-fcmd="bold"><b>B</b></button>
      <button data-fcmd="italic"><i>I</i></button>
      <button data-fcmd="underline"><u>U</u></button>
      <div style="width:1px; background:rgba(255,255,255,0.2); margin:0 4px;"></div>
      <button data-fcmd="hiliteColor" value="#fdf0a8" style="color:#fdf0a8;">🖊 ไฮไลต์</button>
    </div>
  `;
  
  const rows = document.getElementById('olRows');
  let draggedIdx = null;

  function draw(){
    rows.innerHTML = '';
    let skipLevel = -1; 
    
    item.content.items.forEach((line, idx) => {
      if(line.collapsed === undefined) line.collapsed = false;
      if(line.isTask === undefined) line.isTask = false;
      if(line.checked === undefined) line.checked = false;

      if (skipLevel !== -1) {
        if (line.level > skipLevel) return; 
        else skipLevel = -1; 
      }
      if (line.collapsed) skipLevel = line.level;

      const nextLine = item.content.items[idx + 1];
      const hasChildren = nextLine && nextLine.level > line.level; 

      const row = document.createElement('div');
      row.className = 'ol-row';
      row.draggable = true;
      row.dataset.idx = idx;
      row.style.paddingLeft = (line.level * 36) + 'px'; // เลื่อนย่อหน้าให้กว้างขึ้น ดูง่ายขึ้น
      
      // วาดเส้นไกด์ไลน์ (Tree Line) ระบุความเป็นพ่อลูก
      let guidesHtml = '';
      for(let i=1; i<=line.level; i++) {
         guidesHtml += `<div class="ol-guide" style="left: ${i * 36 + 18}px;"></div>`;
      }

      let arrowClass = 'ol-collapse';
      if (!hasChildren) arrowClass += ' hidden';
      if (line.collapsed) arrowClass += ' is-collapsed';

      let bulletHtml = line.isTask 
        ? `<div class="ol-checkbox ${line.checked ? 'checked' : ''}" data-act="check">✓</div>` 
        : `<button class="ol-bullet-btn" title="เปลี่ยนเป็น Checklist" data-act="toggleTask">•</button>`;

      row.innerHTML = `
        ${guidesHtml}
        <div class="ol-controls">
          <div class="ol-drag" title="ลากเพื่อสลับที่">⋮⋮</div>
          <button class="${arrowClass}" data-act="collapse">▼</button>
          ${bulletHtml}
        </div>
        <div class="ol-text" contenteditable="true" data-checked="${line.checked}" data-placeholder="พิมพ์เนื้อหา...">${line.text}</div>
        <div class="ol-btns">
          <button data-act="task" title="เปิด/ปิด Checklist">☑</button>
          <button data-act="out" title="เลื่อนซ้าย (Shift+Tab)">←</button>
          <button data-act="in" title="เลื่อนขวา (Tab)">→</button>
          <button data-act="del" title="ลบทิ้ง">✕</button>
        </div>
      `;
      
      // --- ระบบ Drag & Drop ---
      const dragHandle = row.querySelector('.ol-drag');
      dragHandle.addEventListener('mousedown', () => row.setAttribute('draggable', 'true'));
      row.addEventListener('dragstart', e => { draggedIdx = idx; setTimeout(() => row.classList.add('dragging'), 0); });
      row.addEventListener('dragend', e => { row.classList.remove('dragging'); row.removeAttribute('draggable'); draggedIdx = null; draw(); });
      row.addEventListener('dragover', e => { e.preventDefault(); row.style.boxShadow = "0 -2px 0 var(--amber)"; });
      row.addEventListener('dragleave', e => { row.style.boxShadow = ""; });
      row.addEventListener('drop', e => {
        e.preventDefault(); row.style.boxShadow = "";
        if(draggedIdx === null || draggedIdx === idx) return;
        
        let dragCount = 1; let dragLevel = item.content.items[draggedIdx].level;
        for(let i = draggedIdx + 1; i < item.content.items.length; i++) {
           if(item.content.items[i].level > dragLevel) dragCount++; else break;
        }
        
        const movedItems = item.content.items.splice(draggedIdx, dragCount);
        let newIdx = draggedIdx < idx ? idx - dragCount + 1 : idx;
        
        const targetLevel = item.content.items[newIdx] ? item.content.items[newIdx].level : 0;
        const levelDiff = targetLevel - movedItems[0].level;
        movedItems.forEach(mi => { mi.level = Math.max(0, mi.level + levelDiff); });

        item.content.items.splice(newIdx, 0, ...movedItems);
        item.updatedAt = now(); draw();
      });

      // --- การพิมพ์ และ คีย์ลัด ---
      const inp = row.querySelector('.ol-text');
      let t;
      inp.addEventListener('input', () => {
         clearTimeout(t); t = setTimeout(() => { line.text = inp.innerHTML; item.updatedAt=now(); }, 300);
      });

      inp.addEventListener('keydown', e => {
        if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); insertAfter(idx, line.level); }
        if(e.key === 'Tab') {
           e.preventDefault();
           if (e.shiftKey) { line.level = Math.max(0, line.level - 1); }
           else { line.level = Math.min(6, line.level + 1); }
           item.updatedAt=now(); draw(); focusRow(idx);
        }
        if(e.key === 'Backspace' && inp.innerText.trim() === '') {
           e.preventDefault();
           if(item.content.items.length > 1) {
               item.content.items.splice(idx, 1); item.updatedAt=now(); draw(); focusRow(Math.max(0, idx - 1));
           }
        }
      });

      // --- การทำงานของปุ่ม ---
      row.querySelector('[data-act="collapse"]').onclick = () => { line.collapsed = !line.collapsed; item.updatedAt=now(); draw(); };
      const checkBtn = row.querySelector('[data-act="check"]');
      if(checkBtn) checkBtn.onclick = () => { line.checked = !line.checked; item.updatedAt=now(); draw(); };
      const toggleTaskBtn = row.querySelector('[data-act="toggleTask"]');
      if(toggleTaskBtn) toggleTaskBtn.onclick = () => { line.isTask = true; item.updatedAt=now(); draw(); };
      
      row.querySelector('[data-act="task"]').onclick = () => { line.isTask = !line.isTask; item.updatedAt=now(); draw(); };
      row.querySelector('[data-act="out"]').onclick = () => { line.level = Math.max(0, line.level - 1); item.updatedAt=now(); draw(); focusRow(idx); };
      row.querySelector('[data-act="in"]').onclick = () => { line.level = Math.min(6, line.level + 1); item.updatedAt=now(); draw(); focusRow(idx); };
      row.querySelector('[data-act="del"]').onclick = () => { if(item.content.items.length > 1) { item.content.items.splice(idx, 1); item.updatedAt=now(); draw(); } };

      rows.appendChild(row);
    });
  }

  function insertAfter(idx, level){
    item.content.items.splice(idx+1,0,{id:uid(), text:'', level: level, collapsed:false, isTask:false, checked:false});
    item.updatedAt=now(); draw(); focusRow(idx+1);
  }

  function focusRow(idx){ 
    setTimeout(()=>{ const el = rows.querySelector(`.ol-row[data-idx="${idx}"] .ol-text`); if(el) el.focus(); }, 50);
  }

  document.getElementById('olAdd').onclick = ()=> insertAfter(item.content.items.length-1, 0);
  
  // ลบ Task ที่เสร็จแล้ว
  document.getElementById('olClearChecked').onclick = () => {
    const beforeCount = item.content.items.length;
    item.content.items = item.content.items.filter(i => !i.checked);
    if(item.content.items.length === 0) item.content.items.push({id:uid(), text:'', level:0}); // กันไม่ให้โล่ง
    if(beforeCount > item.content.items.length) { item.updatedAt=now(); draw(); toast("ลบ Task ที่เสร็จแล้วเรียบร้อย! 🧹"); }
    else { toast("ไม่มี Task ที่ขีดฆ่าให้ลบครับ"); }
  };

  draw();

  // --- แก้บั๊ก Floating Menu (ทำงาน 100%) ---
  const fm = document.getElementById('floatingMenuOutline');
  document.addEventListener('selectionchange', () => {
    const activeEl = document.activeElement;
    if(!activeEl || !activeEl.classList.contains('ol-text')) return;
    let sel = window.getSelection();
    if(sel.toString().length > 0 && sel.rangeCount > 0) {
      let rect = sel.getRangeAt(0).getBoundingClientRect();
      fm.classList.add('show');
      fm.style.top = (rect.top - 45) + 'px';
      fm.style.left = (rect.left + (rect.width/2) - 80) + 'px';
    } else { fm.classList.remove('show'); }
  });
  
  fm.querySelectorAll('[data-fcmd]').forEach(b => {
    b.onclick = (e) => {
      e.preventDefault();
      document.execCommand(b.dataset.fcmd, false, b.value || null);
      if(document.activeElement) document.activeElement.focus();
    };
  });
}

// ฟังก์ชันแสดงข้อความแจ้งเตือน (แก้บั๊กแสดงผล + บังคับเล่นแอนิเมชันใหม่)
function showAuthMsg(msg, type) {
  const msgBox = document.getElementById('authMsg');
  let icon = '';
  if (type === 'error') icon = '❌';
  else if (type === 'success') icon = '✅';
  else if (type === 'warning') icon = '⚠️';
  else if (type === 'info') icon = '⏳';
  
  // 1. ซ่อนก่อนเพื่อรีเซ็ต
  msgBox.style.display = 'none'; 
  
  // 2. ทริกหลอกเบราว์เซอร์ให้โหลดแอนิเมชันใหม่ (Trigger Reflow)
  void msgBox.offsetWidth; 
  
  // 3. ใส่คลาสและข้อความ
  msgBox.className = `auth-msg ${type}`;
  msgBox.innerHTML = `<span>${icon}</span> <span style="line-height:1.4;">${msg}</span>`;
  
  // 4. สั่งให้โชว์ (ล้างค่าที่ถูกซ่อนไว้)
  msgBox.style.display = 'flex'; 
}

function switchAuthView(view) {

  document.getElementById('viewRegister').style.display = 'none';

    document.getElementById('authSubtitle').innerText = 'ยินดีต้อนรับกลับมา! เลือกบัญชีของคุณ';

// 2. 📝 ลงทะเบียน (ดักครบทุกกรณี)
function doRegister() {
  const name = document.getElementById('regName').value.trim();
  const id = document.getElementById('regId').value.trim();
  const pwd = document.getElementById('regPwd').value;
  const pwdConfirm = document.getElementById('regPwdConfirm').value;

  // กรณี 1: ลืมกรอกข้อมูล (สีเหลือง)
  if (!name || !id || !pwd) return showAuthMsg('กรุณากรอกข้อมูลให้ครบทุกช่องครับ', 'warning');
  
  // กรณี 2: รหัสผ่านสั้นเกินไป (สีเหลือง)
  if (pwd.length < 6) return showAuthMsg('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร', 'warning');
  
  // กรณี 3: พิมพ์รหัสยืนยันไม่ตรง (สีแดง)
  if (pwd !== pwdConfirm) return showAuthMsg('รหัสผ่านไม่ตรงกัน กรุณาเช็กอีกครั้ง', 'error');
  
  const email = id + "@sarupsi.com"; 
  const avatar = `https://api.dicebear.com/7.x/micah/svg?seed=${encodeURIComponent(name)}&backgroundColor=fdfbf7`;

  // กรณี 4: กำลังส่งข้อมูล (สีฟ้า)
  showAuthMsg('กำลังสร้างบัญชีบน Cloud...', 'info');

  auth.createUserWithEmailAndPassword(email, pwd)
    .then((userCred) => {
      const newUser = { name, id, avatar };
      return db.ref('users/' + userCred.user.uid + '/profile').set(newUser);
    })
    .then(() => {
      // กรณี 5: สมัครสำเร็จ (สีเขียว)
      showAuthMsg('สมัครสำเร็จ! ยินดีต้อนรับสู่ SARUPSI 🎉', 'success');
      // ไม่ต้องเขียนต่อ เพราะ onAuthStateChanged ด้านบนจะรับช่วงพาเข้าแอปเอง!
    })
    .catch((error) => {
      // กรณี 6: พิมพ์ ID ที่เคยมีคนสมัครไว้แล้ว (สีแดง)
      if(error.code === 'auth/email-already-in-use') {
        showAuthMsg('รหัส ID นี้มีบัญชีอยู่แล้ว! กำลังพากลับไปหน้าเข้าสู่ระบบ...', 'error');
        setTimeout(() => { switchAuthView('login'); document.getElementById('loginId').value = id; }, 2000);
      } else {
        showAuthMsg('เกิดข้อผิดพลาด: ' + error.message, 'error');
      }
    });
}

// 3. 🔐 เข้าสู่ระบบ (ดักจากระบบของ Firebase โดยตรง)
function doLogin() {
  const id = document.getElementById('loginId').value.trim();
  const pwd = document.getElementById('loginPwd').value;
  
  // กรณี 1: ลืมกรอกข้อมูล (สีเหลือง)
  if (!id || !pwd) return showAuthMsg('กรุณากรอก ID และรหัสผ่าน', 'warning');

  // กรณี 2: กำลังล็อกอิน (สีฟ้า)
  showAuthMsg('กำลังตรวจสอบข้อมูล...', 'info');
  const email = id + "@sarupsi.com";

  auth.signInWithEmailAndPassword(email, pwd)
    .then((userCred) => {
       // กรณี 3: รหัสถูก เข้าแอปสำเร็จ (สีเขียว)
       showAuthMsg('เข้าสู่ระบบสำเร็จ! กำลังเตรียมข้อมูล...', 'success');
       db.ref('users/' + userCred.user.uid + '/profile').once('value').then(snap => {
         const pf = snap.val();
         if(pf && !savedLogins.find(u => u.id === pf.id)) {
           savedLogins.push({ id: pf.id, name: pf.name, avatar: pf.avatar });
           localStorage.setItem('sarupsi_saved_logins', JSON.stringify(savedLogins));
         }
       });
    })
    .catch((error) => {
      // ถ้ารหัสผิด ให้ล้างช่องรหัสรอให้พิมพ์ใหม่
      document.getElementById('loginPwd').value = '';
      document.getElementById('loginPwd').focus();
      
      // กรณี 4: รหัสผิด / ไม่มีบัญชีนี้ (สีแดง)
      if(error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
         showAuthMsg('ID หรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่', 'error');
      } 
      // กรณี 5: สแปมใส่รหัสผิดจนระบบล็อก (สีแดงเข้ม)
      else if (error.code === 'auth/too-many-requests') {
         showAuthMsg('ใส่รหัสผิดบ่อยเกินไป ระบบระงับชั่วคราว กรุณารอสักครู่ 🚫', 'error');
      } else {
         showAuthMsg('เข้าสู่ระบบไม่ได้: ' + error.message, 'error');
      }
    });
}

function removeProfile(event, id) {

  localStorage.setItem('sarupsi_saved_logins', JSON.stringify(savedLogins));
  if (savedLogins.length === 0) switchAuthView('login');
  else renderSavedProfiles();
}

          <div>
            <label style="font-size: 13px; font-weight: 600; color: var(--text-soft); display:block; margin-bottom:6px;">1. เลือกลายเส้น (Art Style)</label>
            <select id="avStyle" style="width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--paper-line); font-family: 'Inter', 'Kanit', sans-serif; font-size: 14px; outline: none; cursor:pointer; background:#fff;">
              <option value="micah" ${currentStyle==='micah'?'selected':''}>🧑 Micah (คนมินิมอล)</option>
              <option value="avataaars" ${currentStyle==='avataaars'?'selected':''}>👤 Avataaars (คนสไตล์แอปเปิล)</option>
              <option value="lorelei" ${currentStyle==='lorelei'?'selected':''}>🎀 Lorelei (การ์ตูนสีน้ำ)</option>
              <option value="fun-emoji" ${currentStyle==='fun-emoji'?'selected':''}>😍 Fun Emoji (อิโมจิน่ารักๆ)</option>
              <option value="bottts" ${currentStyle==='bottts'?'selected':''}>🤖 Bottts (หุ่นยนต์สุดเท่)</option>
              <option value="adventurer" ${currentStyle==='adventurer'?'selected':''}>⚔️ Adventurer (สาย RPG)</option>
            </select>
          </div>
          <div>
            <label style="font-size: 13px; font-weight: 600; color: var(--text-soft); display:block; margin-bottom:6px;">2. พิมพ์มั่วๆ เพื่อสุ่มหน้าตา (Magic Seed)</label>
            <div style="display:flex; gap:8px;">
              <input type="text" id="avSeed" value="${escapeHtml(currentSeed)}" style="flex:1; padding: 12px; border-radius: 12px; border: 2px solid var(--paper-line); font-family: inherit; font-size: 14px; outline: none;" placeholder="พิมพ์อะไรก็ได้...">
              <button id="avDice" style="padding: 0 16px; border-radius: 12px; border: none; background: var(--amber); color:#fff; cursor: pointer; font-size:20px; transition:0.2s;" title="ทอยเต๋าสุ่มหน้า">🎲</button>
            </div>
          </div>
          <div>
            <label style="font-size: 13px; font-weight: 600; color: var(--text-soft); display:block; margin-bottom:6px;">3. สีพื้นหลัง (Background Color)</label>
            <input type="color" id="avBg" value="#${currentBg === 'transparent' ? 'ffffff' : currentBg}" style="width: 100%; height: 44px; border-radius: 12px; border: 2px solid var(--paper-line); cursor: pointer; padding: 2px; background:#fff;">
          </div>
        </div>
        <div style="display:flex; gap:10px; margin-top: 32px;">
          <button style="flex:1; background: var(--paper); border: none; padding: 14px; border-radius: 12px; font-weight: 600; color: var(--text-soft); cursor: pointer;" onclick="closeModal()">ยกเลิก</button>
          <button style="flex:2; background: linear-gradient(135deg, #4f46e5, #818cf8); border: none; padding: 14px; border-radius: 12px; font-weight: 600; color: #fff; cursor: pointer; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);" id="saveAvatarBtn">✨ บันทึกโปรไฟล์</button>
        </div>
      </div>
    </div>
  `;
  
  const styleSel = document.getElementById('avStyle');
  const seedInp = document.getElementById('avSeed');
  const bgInp = document.getElementById('avBg');
  const preview = document.getElementById('avPreview');
  const previewWrap = document.getElementById('avPreviewWrap');
  
  const updatePreview = () => {
    const style = styleSel.value;
    const seed = encodeURIComponent(seedInp.value || 'smile');
    const bg = bgInp.value.replace('#', '');
    preview.src = `https://api.dicebear.com/7.x/${style}/svg?seed=${seed}&backgroundColor=${bg}`;
    previewWrap.style.backgroundColor = '#' + bg;
  };
  
  styleSel.addEventListener('change', updatePreview);
  seedInp.addEventListener('input', updatePreview);
  bgInp.addEventListener('input', updatePreview);
  
  document.getElementById('avDice').onclick = () => { seedInp.value = uid(); updatePreview(); };
  document.getElementById('ovlStudio').addEventListener('click', e => { if(e.target.id === 'ovlStudio') closeModal(); });
  
  document.getElementById('saveAvatarBtn').onclick = () => {
     activeUser.avatar = preview.src;
     
     // อัปเดตขึ้น Cloud ทันที!
     db.ref('users/' + auth.currentUser.uid + '/profile').update({ avatar: activeUser.avatar });
     
     const sIndex = savedLogins.findIndex(u => u.id === activeUser.id);
     if(sIndex !== -1) {
       savedLogins[sIndex].avatar = activeUser.avatar;
       localStorage.setItem('sarupsi_saved_logins', JSON.stringify(savedLogins));
     }
     
     document.getElementById('appUserAvatar').src = activeUser.avatar;
     closeModal(); toast('✨ อัปเดตรูปโปรไฟล์ขึ้น Cloud เรียบร้อย!');
  };
}

// ==========================================
// ⚡ REAL-TIME LIVE CLOUD SYNC (ซิงค์ไวทันใจ + Real-time)
// ==========================================
let saveTimeout = null;

// ฟังก์ชันสั่งเซฟขึ้น Cloud ทันที (มีความหน่วง 0.3 วิ ป้องกันข้อมูลชนกันตอนพิมพ์รัวๆ)
function triggerCloudSync() {
  if (!auth.currentUser || !data || !data.years) return;
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    db.ref('users/' + auth.currentUser.uid + '/data').set(data);
    localStorage.setItem('sarupsi_sel', JSON.stringify(sel));
  }, 300); // 300 มิลลิวินาที = เร็วเกือบจะ Real-time โดยไม่หน่วงเครื่อง
}

// ผูกตัวดักฟัง (Listener) ข้อมูลจากเครื่องอื่นแบบสดๆ
function setupRealtimeSync(uid) {
  db.ref('users/' + uid + '/data').on('value', (snapshot) => {
    const cloudData = snapshot.val();
    if (cloudData && cloudData.years) {
      const localStr = JSON.stringify(data);
      const cloudStr = JSON.stringify(cloudData);
      
      // ถ้าข้อมูลบน Cloud ไม่ตรงกับเครื่องนี้ (แปลว่ามีเครื่องอื่นแก้) ให้ดึงข้อมูลใหม่มาแสดง
      if (localStr !== cloudStr) {
        data = cloudData;
        // ถือว่าผู้ใช้อาจจะไม่ได้กำลังพิมพ์อยู่ ถึงจะรีเฟรชหน้าจออัตโนมัติป้องกันเคอร์เซอร์หลุด
        if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA' && !document.activeElement.isContentEditable) {
          renderSidebar();
          renderContent();
        }
      }
    }
  });
}

// 💡 แทรกคำสั่งเปิดใช้งาน Real-time Listener เข้าไปตอนล็อกอินสำเร็จ
// ให้เลื่อนไปดูฟังก์ชัน onAuthStateChanged ด้านบน แล้วเรียกใช้ setupRealtimeSync(user.uid);
// หมายเหตุ: ไม่ต้องเรียกใช้ renderAll() ล่างสุดแล้ว เพราะระบบ onAuthStateChanged (ตัวรับสัญญาณข้อ 1) จะคอยจัดการเรียกให้เราเองครับ
</script>
</body>
